<!DOCTYPE html>
<html lang="{{ get_locale() }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}{{ _('在庫管理システム') }}{% endblock %}</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <nav class="navbar navbar-dark bg-primary px-3">
    <a class="navbar-brand fw-bold fs-5" href="{{ url_for('index') }}">
      <i class="bi bi-box-seam me-2"></i>{{ _('在庫管理システム') }}
    </a>
    <div class="d-flex gap-2 align-items-center">
      <div class="dropdown">
        <button class="btn btn-outline-light btn-sm dropdown-toggle" type="button"
                data-bs-toggle="dropdown" aria-expanded="false">
          <i class="bi bi-translate me-1"></i>{% if get_locale() == 'en' %}English{% else %}日本語{% endif %}
        </button>
        <ul class="dropdown-menu dropdown-menu-end">
          <li>
            <a class="dropdown-item {% if get_locale() == 'ja' %}active{% endif %}"
               href="{{ url_for('set_language', lang='ja') }}">日本語</a>
          </li>
          <li>
            <a class="dropdown-item {% if get_locale() == 'en' %}active{% endif %}"
               href="{{ url_for('set_language', lang='en') }}">English</a>
          </li>
        </ul>
      </div>
      <a href="{{ url_for('admin') }}" class="btn btn-outline-light btn-sm">
        <i class="bi bi-gear me-1"></i>{{ _('管理') }}
      </a>
    </div>
  </nav>

  <main class="container-fluid px-3 py-3">
    {% block content %}{% endblock %}
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  {% if html5qrcode %}
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  {% endif %}
  {% block scripts %}{% endblock %}
</body>
</html>
