<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}在庫管理システム{% endblock %}</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <nav class="navbar navbar-dark bg-primary px-3">
    <a class="navbar-brand fw-bold fs-5" href="{{ url_for('index') }}">
      <i class="bi bi-box-seam me-2"></i>在庫管理システム
    </a>
    <div class="d-flex gap-2">
      <a href="{{ url_for('admin') }}" class="btn btn-outline-light btn-sm">
        <i class="bi bi-gear me-1"></i>管理
      </a>
    </div>
  </nav>

  <main class="container-fluid px-3 py-3">
    {% block content %}{% endblock %}
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  {% if html5qrcode %}
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  {% endif %}
  {% block scripts %}{% endblock %}
</body>
</html>
